version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/misago.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git   # 自建/无上游镜像：版本由本仓库 tag 决定

build:
  run_buildscript: false

images: []

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales:
      - zh
      - en
  private:
    enabled: false
